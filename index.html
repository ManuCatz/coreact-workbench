<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawing Library Prototype</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
        font-family: sans-serif;
      }
      #app {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        max-height: 90vh;
      }
      #menu {
        width: 250px;
        height: 800px;
        background-color: white;
        border: 1px solid #ccc;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        padding: 15px;
        overflow-y: auto;
      }
      #menu h2 {
        margin-top: 0;
        font-size: 1.2rem;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
      }
      #menu h3 {
        font-size: 1rem;
        color: #333;
        margin-bottom: 5px;
      }
      #canvas {
        background-color: white;
        border: 1px solid #ccc;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      
      /* Tree View Styles */
      .tree-node {
        margin-left: 15px;
        line-height: 1.5;
        transition: opacity 0.3s ease;
      }
      .tree-node.root-node {
        margin-left: 0;
      }
      .node-header {
        display: flex;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .node-header:hover {
        background-color: #f9f9f9;
      }
      .toggle-icon {
        display: inline-block;
        width: 15px;
        text-align: center;
        margin-right: 5px;
        font-size: 0.8em;
        color: #666;
      }
      .node-label {
        font-size: 0.9em;
        color: #2c3e50;
      }
      .node-children {
        display: none;
      }
      .tree-node.expanded > .node-children {
        display: block;
      }
      .tree-node.expanded > .node-header > .toggle-icon::before {
        content: "▼";
      }
      .tree-node > .node-header > .toggle-icon {
        cursor: pointer;
      }
      .tree-node > .node-header > .toggle-icon::before {
        content: "▶";
      }
      .tree-node.empty > .node-header > .toggle-icon {
        cursor: default;
      }
      .tree-node.empty > .node-header > .toggle-icon::before {
        content: "•";
        color: #ccc;
      }
      .tree-node.empty > .node-header {
        cursor: default;
      }
      
      /* Selection Highlight Styles */
      .node-label {
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 3px;
        transition: background-color 0.2s, color 0.2s;
      }
      .node-label:hover {
        background-color: #e0e0e0;
      }
      
      /* Canvas transitions for smooth fading */
      #canvas * {
        transition: opacity 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="menu">
        <h2>Artefacts Menu</h2>
        <div id="menu-content"></div>
      </div>
      <svg id="canvas" width="800" height="800"></svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
