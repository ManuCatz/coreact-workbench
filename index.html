<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawing Library Prototype</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        min-height: 100vh;
        background-color: #f0f0f0;
        font-family: sans-serif;
      }
      #app {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        max-height: 100vh;
        max-width: 100vw;
        overflow: auto;
        padding: 20px;
        box-sizing: border-box;
        margin: 0 auto; /* Center it horizontally if there's space */
      }
      #menu, #inspector {
        flex-shrink: 0;
        width: 250px;
        height: 800px;
        background-color: white;
        border: 1px solid #ccc;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        padding: 15px;
        overflow-y: auto;
      }
      #menu h2, #inspector h2 {
        margin-top: 0;
        font-size: 1.2rem;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
      }
      #menu h3, #inspector h3 {
        font-size: 1rem;
        color: #333;
        margin-bottom: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .add-sort-btn {
        background-color: #2ecc71;
        color: white;
        border: none;
        border-radius: 3px;
        width: 22px;
        height: 22px;
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        transition: background-color 0.2s;
      }
      .add-sort-btn:hover {
        background-color: #27ae60;
      }
      #canvas {
        flex-shrink: 0;
        background-color: white;
        border: 1px solid #ccc;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      
      /* Tree View Styles */
      .tree-node {
        margin-left: 15px;
        line-height: 1.5;
        transition: opacity 0.3s ease;
      }
      .tree-node.root-node {
        margin-left: 0;
      }
      .node-header {
        display: flex;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .node-header:hover {
        background-color: #f9f9f9;
      }
      .toggle-icon {
        display: inline-block;
        width: 15px;
        text-align: center;
        margin-right: 5px;
        font-size: 0.8em;
        color: #666;
      }
      .node-label {
        font-size: 0.9em;
        color: #2c3e50;
      }
      .node-children {
        display: none;
      }
      .tree-node.expanded > .node-children {
        display: block;
      }
      .tree-node.expanded > .node-header > .toggle-icon::before {
        content: "▼";
      }
      .tree-node > .node-header > .toggle-icon {
        cursor: pointer;
      }
      .tree-node > .node-header > .toggle-icon::before {
        content: "▶";
      }
      .tree-node.empty > .node-header > .toggle-icon {
        cursor: default;
      }
      .tree-node.empty > .node-header > .toggle-icon::before {
        content: "•";
        color: #ccc;
      }
      .tree-node.empty > .node-header {
        cursor: default;
      }
      
      /* Selection Highlight Styles */
      .node-label {
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 3px;
        transition: background-color 0.2s, color 0.2s;
      }
      .node-label:hover {
        background-color: #e0e0e0;
      }
      .tree-node.inspected > .node-header {
        background-color: #d6eaf8;
        border-radius: 3px;
      }
      
      .remove-btn {
        margin-left: auto;
        color: #e74c3c;
        cursor: pointer;
        font-weight: bold;
        padding: 0 4px;
        border-radius: 3px;
        font-size: 0.9em;
        opacity: 0.3;
        transition: opacity 0.2s, background-color 0.2s;
      }
      .node-header:hover .remove-btn {
        opacity: 1;
      }
      .remove-btn:hover {
        background-color: #fadbd8;
      }
      
      /* Canvas transitions for smooth fading */
      #canvas * {
        transition: opacity 0.3s ease;
      }
      
      /* Inspector Forms */
      .form-group {
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        font-size: 0.85rem;
        color: #555;
        margin-bottom: 4px;
        text-transform: capitalize;
      }
      .form-group input[type="text"],
      .form-group input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        border: 1px solid #ccc;
        border-radius: 3px;
        font-family: inherit;
      }
      .form-group.checkbox {
        display: flex;
        align-items: center;
      }
      .form-group.checkbox label {
        display: inline;
        margin-bottom: 0;
        margin-left: 6px;
      }
      .form-group.position {
        display: flex;
        gap: 6px;
      }
      .form-group.position input {
        flex: 1;
        width: 0; /* Allow flex to shrink properly */
      }
      .pick-btn, .pick-dep-btn {
        padding: 4px 8px;
        border: 1px solid #ccc;
        background-color: #f8f9f9;
        border-radius: 3px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background-color 0.2s, border-color 0.2s;
      }
      .pick-btn:hover, .pick-dep-btn:hover {
        background-color: #e5e8e8;
      }
      .pick-dep-btn.active {
        background-color: #aed6f1;
        border-color: #3498db;
        font-weight: bold;
      }
      .action-btns {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .btn {
        flex: 1;
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.9rem;
      }
      .btn-cancel {
        background-color: #e74c3c;
        color: white;
      }
      .btn-cancel:hover {
        background-color: #c0392b;
      }
      .btn-validate {
        background-color: #3498db;
        color: white;
      }
      .btn-validate:hover:not(:disabled) {
        background-color: #2980b9;
      }
      .btn-validate:disabled {
        background-color: #bdc3c7;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="menu">
        <h2>Artefacts Menu</h2>
        <div id="menu-content"></div>
      </div>
      <svg id="canvas" width="800" height="800"></svg>
      <div id="inspector">
        <h2>Inspector</h2>
        <div id="inspector-content">
          <p style="color: #666; font-style: italic;">Select an artefact to inspect.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
