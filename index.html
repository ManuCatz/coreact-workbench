<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawing Library Prototype</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        min-height: 100vh;
        background-color: #f0f0f0;
        font-family: sans-serif;
      }
      #app {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        max-height: 100vh;
        max-width: 100vw;
        overflow: auto;
        padding: 20px;
        box-sizing: border-box;
        margin: 0 auto; /* Center it horizontally if there's space */
      }
      #menu, #inspector, #rules-panel {
        flex-shrink: 0;
        width: 270px;
        height: 800px;
        background-color: white;
        border: 1px solid #ccc;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        padding: 15px;
        overflow-y: auto;
      }
      #menu h2, #inspector h2, #rules-panel h2 {
        margin-top: 0;
        font-size: 1.1rem;
        border-bottom: 1px solid #eee;
        padding-bottom: 8px;
        margin-bottom: 10px;
      }
      #menu h3, #inspector h3 {
        font-size: 0.95rem;
        color: #333;
        margin-top: 10px;
        margin-bottom: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .rule-app-row {
        position: relative;
        padding: 4px 6px;
        background-color: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 4px;
        font-size: 0.8rem;
        margin-top: 4px;
        cursor: pointer;
        transition: background-color 0.2s, border-color 0.2s;
      }
      .rule-app-row:hover {
        background-color: #ebf5fb;
        border-color: #3498db;
      }
      .rule-app-row.first-order {
        border-left: 3px solid #8e44ad;
        background-color: #f6f0fa;
      }
      .rule-app-row.first-order:hover {
        border-color: #8e44ad;
        background-color: #ede4f5;
      }
      .rule-app-row.not-applyable {
        opacity: 0.6;
        cursor: default;
      }
      .rule-app-row.not-applyable:hover {
        background-color: #f8f9fa;
        border-color: #e9ecef;
      }
      .apply-btn {
        position: absolute;
        top: 4px;
        right: 6px;
        background-color: #2ecc71;
        color: white;
        border: none;
        border-radius: 3px;
        padding: 2px 8px;
        font-size: 0.7rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .apply-btn:hover {
        background-color: #27ae60;
      }
      .rule-app-name {
        font-weight: 600;
        color: #2c3e50;
      }
      .rule-app-match {
        color: #555;
        margin-top: 2px;
      }
      .add-sort-btn {
        background-color: #2ecc71;
        color: white;
        border: none;
        border-radius: 3px;
        width: 22px;
        height: 22px;
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        transition: background-color 0.2s;
      }
      .add-sort-btn:hover {
        background-color: #27ae60;
      }
      #canvas {
        flex-shrink: 0;
        background-color: white;
        border: 1px solid #ccc;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      
      /* Tree View Styles */
      .tree-node {
        margin-left: 12px;
        line-height: 1.5;
        transition: opacity 0.3s ease;
      }
      .tree-node.root-node {
        margin-left: 0;
      }
      .node-header {
        display: flex;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .node-header:hover {
        background-color: #f9f9f9;
      }
      .toggle-icon {
        display: inline-block;
        width: 15px;
        text-align: center;
        margin-right: 5px;
        font-size: 0.8em;
        color: #666;
      }
      .node-label {
        font-size: 0.85em;
        color: #2c3e50;
      }
      .layer-badge {
        font-size: 0.75em;
        background: #e0e0e0;
        color: #555;
        padding: 1px 4px;
        border-radius: 3px;
        margin-left: 4px;
      }
      .node-children {
        display: none;
      }
      .tree-node.expanded > .node-children {
        display: block;
      }
      .tree-node.expanded > .node-header > .toggle-icon::before {
        content: "▼";
      }
      .tree-node > .node-header > .toggle-icon {
        cursor: pointer;
      }
      .tree-node > .node-header > .toggle-icon::before {
        content: "▶";
      }
      .tree-node.empty > .node-header > .toggle-icon {
        cursor: default;
      }
      .tree-node.empty > .node-header > .toggle-icon::before {
        content: "•";
        color: #ccc;
      }
      .tree-node.empty > .node-header {
        cursor: default;
      }
      
      /* Layer Tree Styles */
      .layers-tree-container {
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 2px dashed #eee;
      }
      .layer-item {
        margin-left: 10px;
        margin-top: 4px;
      }
      .layer-item.root-layer {
        margin-left: 0;
      }
      .layer-row {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px 6px;
        background-color: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 4px;
        font-size: 0.8rem;
      }
      .layer-row.focused {
        border-color: #3498db;
        background-color: #ebf5fb;
      }
      .layer-row.layer-hidden {
        opacity: 0.65;
        background-color: #f2f2f2;
      }
      .layer-title {
        font-weight: 600;
        color: #2c3e50;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .layer-btn {
        padding: 2px 5px;
        font-size: 0.7rem;
        border: 1px solid #ccc;
        background-color: #fff;
        border-radius: 3px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .layer-btn:hover {
        background-color: #e2e6ea;
      }
      .layer-btn.focus-btn.active {
        background-color: #f1c40f;
        color: #000;
        border-color: #f39c12;
        font-weight: bold;
      }
      .layer-btn.hide-btn.active {
        background-color: #e74c3c;
        color: white;
        border-color: #c0392b;
        font-weight: bold;
      }
      .layer-color-input {
        width: 18px;
        height: 18px;
        border: none;
        padding: 0;
        cursor: pointer;
        background: none;
      }
      .provable-badge {
        font-size: 0.7em;
        font-weight: bold;
        padding: 1px 5px;
        border-radius: 3px;
        margin-left: 2px;
        flex-shrink: 0;
      }
      .provable-ok {
        background-color: #d4efdf;
        color: #1e8449;
      }
      .provable-fail {
        background-color: #fadbd8;
        color: #c0392b;
      }
      .provable-btn {
        background-color: #f1c40f;
        border-color: #f39c12;
        font-weight: bold;
      }
      
      /* Selection Highlight Styles */
      .node-label {
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 3px;
        transition: background-color 0.2s, color 0.2s;
      }
      .node-label:hover {
        background-color: #e0e0e0;
      }
      .tree-node.inspected > .node-header {
        background-color: #d6eaf8;
        border-radius: 3px;
      }
      .tree-node.provably-equal > .node-header {
        border-left: 3px solid #8e44ad;
      }
      .eq-badge {
        font-size: 0.75em;
        font-weight: bold;
        color: #8e44ad;
        background: #ebdef0;
        padding: 0 4px;
        border-radius: 3px;
        margin-left: 4px;
      }
      
      .remove-btn {
        margin-left: auto;
        color: #e74c3c;
        cursor: pointer;
        font-weight: bold;
        padding: 0 4px;
        border-radius: 3px;
        font-size: 0.9em;
        opacity: 0.3;
        transition: opacity 0.2s, background-color 0.2s;
      }
      .node-header:hover .remove-btn {
        opacity: 1;
      }
      .remove-btn:hover {
        background-color: #fadbd8;
      }
      
      /* Canvas transitions for smooth fading */
      #canvas * {
        transition: opacity 0.3s ease;
      }
      
      .drawing-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        background-color: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 4px;
        font-size: 0.8rem;
        margin-top: 4px;
      }
      .drawing-row.active {
        border-color: #3498db;
        background-color: #ebf5fb;
      }
      .drawing-row.first-order {
        border-left: 3px solid #8e44ad;
        background-color: #f6f0fa;
      }
      .drawing-title {
        font-weight: 600;
        color: #2c3e50;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rule-badge {
        font-size: 0.7em;
        font-weight: bold;
        background-color: #2ecc71;
        color: white;
        padding: 2px 5px;
        border-radius: 3px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .first-order-badge {
        font-size: 0.7em;
        font-weight: bold;
        background-color: #8e44ad;
        color: white;
        padding: 2px 5px;
        border-radius: 3px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-left: 4px;
      }
      .rule-badge-invalid {
        background-color: #e74c3c;
      }
      .rule-app-name .first-order-badge {
        margin-left: 6px;
      }
      .active-badge {
        font-size: 0.7em;
        font-weight: bold;
        background-color: #3498db;
        color: white;
        padding: 2px 5px;
        border-radius: 3px;
      }
      .current-drawing-banner {
        padding: 6px 8px;
        background-color: #eaf2f8;
        border: 1px solid #aed6f1;
        border-radius: 4px;
        margin-bottom: 12px;
        font-size: 0.82rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      /* Inspector Forms */
      .form-group {
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        font-size: 0.85rem;
        color: #555;
        margin-bottom: 4px;
        text-transform: capitalize;
      }
      .form-group input[type="text"],
      .form-group input[type="number"],
      .form-group select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        border: 1px solid #ccc;
        border-radius: 3px;
        font-family: inherit;
      }
      .form-group.checkbox {
        display: flex;
        align-items: center;
      }
      .form-group.checkbox label {
        display: inline;
        margin-bottom: 0;
        margin-left: 6px;
      }
      .form-group.position {
        display: flex;
        gap: 6px;
      }
      .form-group.position input {
        flex: 1;
        width: 0; /* Allow flex to shrink properly */
      }
      .pick-btn, .pick-dep-btn {
        padding: 4px 8px;
        border: 1px solid #ccc;
        background-color: #f8f9f9;
        border-radius: 3px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background-color 0.2s, border-color 0.2s;
      }
      .pick-btn:hover, .pick-dep-btn:hover {
        background-color: #e5e8e8;
      }
      .pick-dep-btn.active {
        background-color: #aed6f1;
        border-color: #3498db;
        font-weight: bold;
      }
      .action-btns {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .btn {
        flex: 1;
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.9rem;
      }
      .btn-cancel {
        background-color: #e74c3c;
        color: white;
      }
      .btn-cancel:hover {
        background-color: #c0392b;
      }
      .btn-validate {
        background-color: #3498db;
        color: white;
      }
      .btn-validate:hover:not(:disabled) {
        background-color: #2980b9;
      }
      .btn-validate:disabled {
        background-color: #bdc3c7;
        cursor: not-allowed;
      }
      .btn-merge {
        background-color: #9b59b6;
        color: white;
      }
      .btn-merge:hover:not(:disabled) {
        background-color: #8e44ad;
      }
      .btn-merge:disabled {
        background-color: #bdc3c7;
        cursor: not-allowed;
      }
      .merge-preview-box {
        margin-top: 12px;
        padding: 10px;
        background-color: #f4ecf7;
        border: 1px solid #d7bde2;
        border-radius: 4px;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="menu">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; gap: 5px;">
          <h2 style="margin: 0; border: none; padding: 0; font-size: 1rem;">Layers & Artefacts</h2>
          <div style="display: flex; gap: 4px;">
            <button id="load-script-btn" class="btn" style="padding: 4px 6px; font-size: 0.75rem; background-color: #3498db; color: white;" title="Load JS script to define sorts">Load Sorts</button>
            <button id="clear-btn" class="btn btn-cancel" style="padding: 4px 6px; font-size: 0.75rem;" title="Clear all artefacts and layers">Clear All</button>
          </div>
          <input type="file" id="script-upload" accept=".js" style="display: none;" />
        </div>

        <div id="current-drawing-banner" class="current-drawing-banner">
          <span style="color: #555;">Editing: <strong id="active-drawing-name" style="color: #2c3e50;">Unsaved Drawing</strong></span>
          <label title="Explicitly mark the current drawing as a rule (must satisfy rule conditions)" style="display:flex; align-items:center; gap:4px; font-size:0.75rem; color:#555; cursor:pointer;">
            <input type="checkbox" id="mark-rule-checkbox" /> Rule
          </label>
          <span id="active-drawing-rule-tag"></span>
        </div>
        
        <div class="drawings-container" style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px dashed #eee;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <h3 style="margin: 0; font-size: 0.9rem; color: #555;">Drawing Store</h3>
            <div style="display: flex; gap: 4px;">
              <button id="new-drawing-btn" class="layer-btn" style="background-color: #e67e22; color: white; border: none; font-weight: bold;" title="Start a new blank drawing">New</button>
              <button id="import-drawing-btn" class="layer-btn" style="background-color: #3498db; color: white; border: none; font-weight: bold;" title="Import drawing from JSON file">Import</button>
              <button id="save-drawing-btn" class="layer-btn" style="background-color: #2ecc71; color: white; border: none; font-weight: bold;" title="Save current drawing">Save</button>
            </div>
            <input type="file" id="drawing-json-upload" accept=".json" style="display: none;" />
          </div>
          <div id="drawings-content"></div>
        </div>

        <div class="layers-tree-container">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <h3 style="margin: 0; font-size: 0.9rem; color: #555;">Layers Tree</h3>
            <button id="add-root-layer-btn" class="layer-btn" title="Add new root layer">+ Root Layer</button>
          </div>
          <div id="layers-content"></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; margin-bottom: 5px;">
          <h3 style="margin: 0; font-size: 0.9rem; color: #555;">Artefacts</h3>
          <button id="merge-artefacts-btn" class="layer-btn" style="background-color: #9b59b6; color: white; border: none; font-weight: bold;" title="Merge two artefacts with identical dependencies">Merge</button>
        </div>
        <div id="menu-content"></div>
      </div>
      <svg id="canvas" width="800" height="800"></svg>
      <div id="inspector">
        <h2>Inspector</h2>
        <div id="inspector-content">
          <p style="color: #666; font-style: italic;">Select an artefact to inspect.</p>
        </div>
      </div>
      <div id="rules-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px;">
          <h2 style="margin: 0; font-size: 1.1rem; border: none; padding: 0;">Applyable Rules</h2>
          <button id="refresh-rules-btn" class="layer-btn" title="Refresh applyable rules list">Refresh</button>
        </div>
        <div id="rules-content">
          <p style="color: #666; font-style: italic;">No applyable rules.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
